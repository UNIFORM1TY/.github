ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "**/*.yml"
          - "**/*.yaml"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "package-lock.json"
          - "requirements*.txt"
          - "pyproject.toml"
          - "poetry.lock"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"
          - "**/*.test.*"
          - "**/*.spec.*"
          - "**/test_*.py"
          - "**/*_test.py"

frontend:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.tsx"
          - "**/*.jsx"
          - "**/*.css"
          - "src/components/**"

backend:
  - changed-files:
      - any-glob-to-any-file:
          - "src/server/**"
          - "api/**"
          - "bridge/**"
