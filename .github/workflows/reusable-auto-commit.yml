name: Reusable Auto-Commit

# Automates routine commits: formatting, lockfile refresh, generated artifacts.
# Opens a PR instead of pushing to a protected branch when create-pr is true.

on:
  workflow_call:
    inputs:
      commit-message:
        description: "Commit message for the automated commit"
        type: string
        default: "chore: automated maintenance"
      branch:
        description: "Branch to commit on. Empty means current ref."
        type: string
        default: ""
      create-pr:
        description: "Push to a bot branch and open a PR instead of committing directly"
        type: boolean
        default: false
      run-format:
        description: "Run npm run format when present"
        type: boolean
        default: true
      refresh-lockfile:
        description: "Refresh package-lock.json when present"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-commit:
    name: Auto-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch != '' && inputs.branch || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare bot branch
        if: ${{ inputs.create-pr }}
        shell: bash
        run: git checkout -B "bot/automated-maintenance-${GITHUB_RUN_ID}"

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then npm ci || npm install; else npm install; fi
          fi

      - name: Format
        if: ${{ inputs.run-format }}
        shell: bash
        run: |
          if [ -f package.json ]; then npm run format --if-present; fi

      - name: Refresh lockfile
        if: ${{ inputs.refresh-lockfile }}
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm install --package-lock-only --ignore-scripts; fi

      - name: Commit and push
        shell: bash
        run: |
          git config user.name  "uniformity-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "CHANGED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "CHANGED=true" >> "$GITHUB_ENV"
          git commit -m "${{ inputs.commit-message }}"
          TARGET="${{ inputs.create-pr && format('bot/automated-maintenance-{0}', github.run_id) || (inputs.branch != '' && inputs.branch || github.ref_name) }}"
          git push --set-upstream origin "HEAD:${TARGET}"

      - name: Open pull request
        if: ${{ inputs.create-pr && env.CHANGED == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "${{ inputs.commit-message }}" \
            --body "Automated maintenance commit generated by the org-wide reusable workflow." \
            --base "${{ inputs.branch != '' && inputs.branch || github.ref_name }}" \
            --head "bot/automated-maintenance-${GITHUB_RUN_ID}" || echo "PR already exists"
