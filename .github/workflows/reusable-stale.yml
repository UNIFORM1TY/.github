name: Reusable Stale Sweeper

on:
  workflow_call:
    inputs:
      days-before-stale:
        type: number
        default: 60
      days-before-close:
        type: number
        default: 14

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Sweep stale issues and PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: ${{ inputs.days-before-stale }}
          days-before-close: ${{ inputs.days-before-close }}
          stale-issue-message: "This issue has had no activity and is marked stale. Comment to keep it open."
          stale-pr-message: "This PR has had no activity and is marked stale. Comment to keep it open."
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "pinned,security,in-progress"
          exempt-pr-labels: "pinned,security,in-progress"
          operations-per-run: 100
