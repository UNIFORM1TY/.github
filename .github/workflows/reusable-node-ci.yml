name: Reusable Node CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node version to use
        type: string
        default: "20"
      package-manager:
        description: "npm | yarn | pnpm | bun"
        type: string
        default: "npm"
      run-lint:
        type: boolean
        default: true
      lint-blocking:
        description: "Fail the job on lint errors. False = report only (advisory)."
        type: boolean
        default: false
      run-tests:
        type: boolean
        default: true
      run-build:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  node-ci:
    name: Node CI (node ${{ inputs.node-version }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        shell: bash
        run: |
          if [ ! -f package.json ]; then echo "no package.json - skipping"; exit 0; fi
          case "${{ inputs.package-manager }}" in
            yarn) corepack enable && (yarn install --frozen-lockfile || yarn install) ;;
            pnpm) corepack enable && (pnpm install --frozen-lockfile || pnpm install) ;;
            bun)  npm i -g bun && (bun install --frozen-lockfile || bun install) ;;
            *)    if [ -f package-lock.json ]; then npm ci; else npm install; fi ;;
          esac

      - name: Lint
        if: ${{ inputs.run-lint }}
        continue-on-error: ${{ !inputs.lint-blocking }}
        shell: bash
        run: |
          if [ ! -f package.json ]; then exit 0; fi
          # --if-present must precede the script name or npm forwards it to the tool.
          if [ "${{ inputs.package-manager }}" = "bun" ]; then bun run --if-present lint; else npm run --if-present lint; fi

      - name: Test
        if: ${{ inputs.run-tests }}
        shell: bash
        run: |
          if [ ! -f package.json ]; then exit 0; fi
          if [ "${{ inputs.package-manager }}" = "bun" ]; then bun run --if-present test; else npm run --if-present test; fi

      - name: Build
        if: ${{ inputs.run-build }}
        shell: bash
        run: |
          if [ ! -f package.json ]; then exit 0; fi
          if [ "${{ inputs.package-manager }}" = "bun" ]; then bun run --if-present build; else npm run --if-present build; fi
